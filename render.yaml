services:
  - type: web service configuration
    name: binance-demo-algo-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python binance_demo_algo_bot_render_ready.py
    envVars:
      - key: BINANCE_DEMO_API_KEY
        sync: false
      - key: BINANCE_DEMO_API_SECRET
        sync: false
